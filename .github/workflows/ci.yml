# Tests and typecheck on every pull request and every push to main.
# No secrets, no publishing. Actions are pinned to a commit SHA; the comment gives the version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The usual output, and a TAP report kept when the tests fail: for a test file that fails
      # without a failing test, it records the file's exit code, signal and stderr, which the spec
      # output leaves out.
      - name: npm test
        id: test
        run: npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="${{ runner.temp }}/test-report.tap"
      - name: Keep the TAP report (when the tests failed)
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/test-report.tap
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run typecheck
      - run: npm run test:hooks
      - run: npm run build
      - name: The built CLI answers as the source does
        run: npm run check:build

  # Links in the docs, and the performance budgets of spec section 7. The benchmarks only report:
  # timing on shared runners varies too much to fail a build on it.
  checks:
    name: Links and benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:links
      - run: npm run build
      - name: Search benchmark (report only)
        run: node scripts/bench-search.ts --report-only
      - name: Suggest benchmark (report only)
        run: node scripts/bench-suggest.ts --report-only
      - name: Recall and hook benchmark (report only)
        run: node scripts/bench-recall.ts --report-only
      - name: Link index benchmark (report only)
        run: node scripts/bench-links.ts --report-only
      - name: Graph data benchmark (report only)
        run: node scripts/bench-graph.ts --report-only

  # The local app (docs/ui.md §10, §11): the built bundle against its size budget, then the
  # end-to-end tests against magpie ui on a temporary journal. Chromium only.
  app:
    name: App build and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size (at most 200 kB gzipped)
        run: npm run check:bundle
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
