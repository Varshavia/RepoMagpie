# Tests and typecheck on every pull request and every push to main.
# No secrets, no publishing. Actions are pinned to a commit SHA; the comment gives the version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:hooks
      - run: npm run build
      - name: Smoke test the built CLI
        run: node dist/cli/main.js --version

  # Links in the docs, and the performance budgets of spec section 7. The benchmarks only report:
  # timing on shared runners varies too much to fail a build on it.
  checks:
    name: Links and benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:links
      - run: npm run build
      - name: Search benchmark (report only)
        run: node scripts/bench-search.ts --report-only
      - name: Recall and hook benchmark (report only)
        run: node scripts/bench-recall.ts --report-only
