name: Beta feedback
description: Your answers after a week with the beta (TESTING.md, "Day 7").
title: "Beta feedback: "
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Short answers are fine. You can answer in English or Turkish.
        Paste nothing personal: `repomagpie doctor --json` hides secrets, but its paths show your user name.
  - type: input
    id: os
    attributes:
      label: OS and version
      description: For example "Windows 11 24H2" or "macOS 15.5".
    validations:
      required: false
  - type: input
    id: agents
    attributes:
      label: Agents used
      description: The coding agents you used RepoMagpie with, for example "Claude Code, Codex CLI".
    validations:
      required: false
  - type: textarea
    id: setup
    attributes:
      label: Where did setup get stuck, if anywhere?
      description: The step, the command and what you saw. Write "nowhere" if it went through.
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: How many notes do you have after a week?
      description: "`repomagpie doctor` shows the count for each journal, under Journals."
    validations:
      required: false
  - type: textarea
    id: recall
    attributes:
      label: Did your agent or the hook recall a note on its own? What happened?
      description: The package, what the agent or the hook showed, and what you did next.
    validations:
      required: false
  - type: textarea
    id: hook
    attributes:
      label: Did the hook get in your way or slow you down?
      description: When, in which agent, and how often.
    validations:
      required: false
  - type: textarea
    id: readme
    attributes:
      label: Did the README make clear what RepoMagpie does? What wasn't clear?
      description: The part you read, and the question it left open.
    validations:
      required: false
  - type: textarea
    id: liked
    attributes:
      label: What did you like most, and what was missing?
      description: One thing of each is enough.
    validations:
      required: false
  - type: textarea
    id: keep
    attributes:
      label: Will you keep using it, and why?
      description: Yes, no or maybe, with the reason.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: This issue is public.
      options:
        - label: I removed anything personal from what I pasted.
          required: true
