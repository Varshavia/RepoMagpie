# Dependency updates as pull requests, weekly. The maintainer reviews and merges each one; every new
# library still needs approval (CLAUDE.md, section 9). Dev dependencies come as one grouped pull
# request; the package has no runtime dependencies (decision 0025). A release is proposed only once
# it is 7 days old (cooldown): a compromised release is usually found and pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major updates that need work of their own: sigma 4 needs the graph page ported and a decision on
    # the bundle size (roadmap); @types/node stays on the Node floor's major (spec, section 9).
    ignore:
      - dependency-name: sigma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
    # The skill eval's fake project: nothing installs it, and an update would only change the eval's input.
    exclude-paths:
      - "evals/skill/fixture/**"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
